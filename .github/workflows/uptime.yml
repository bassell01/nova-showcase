name: Demo uptime check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Keeps the free-tier demo warm and fails (emailing the repo owner via GitHub
# notifications) when the health endpoint stops reporting UP.
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo health endpoint
        run: |
          body=$(curl -fsS -m 30 https://nova-5se7.onrender.com/actuator/health)
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'
